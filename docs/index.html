<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Field Incremental</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-view="menu" style="--text-size:14pt;">

<div id="app">

  <!-- Persistent HUD (game/upgrades only) -->
  <header id="hud" class="hidden">
    <div class="hud-item"><span class="hud-label">Gold</span><span id="hud-gold">0</span></div>
    <div class="hud-item"><span class="hud-label">Energy</span><span id="hud-energy">0</span>/<span id="hud-energy-max">0</span></div>
    <div class="hud-item"><span class="hud-label">Run</span><span id="hud-run-gold">0</span>g</div>
    <div class="hud-dev dev-only hidden">
      <button id="dev-gold"    class="btn-dev" type="button" data-dev-gold="50"   title="Dev: +50 gold">+50</button>
      <button id="dev-gold100" class="btn-dev" type="button" data-dev-gold="100"  title="Dev: +100 gold">+100</button>
      <button id="dev-gold500" class="btn-dev" type="button" data-dev-gold="500"  title="Dev: +500 gold">+500</button>
      <button id="dev-gold1k"  class="btn-dev" type="button" data-dev-gold="1000" title="Dev: +1000 gold">+1k</button>
    </div>
    <button id="hud-menu" class="btn-ghost" type="button">Menu</button>
  </header>

  <!-- Main Menu -->
  <section id="view-menu" class="view active">
    <h1 class="title">Field Incremental</h1>
    <p class="subtitle">Tap. Harvest. Grow.</p>
    <nav class="menu">
      <button class="btn-primary" data-go="game" type="button">Play</button>
      <button class="btn-secondary" data-go="settings" type="button">Settings</button>
      <button class="btn-secondary" data-go="patchnotes" type="button">Patch Notes</button>
    </nav>
    <p class="version-tag">v<span id="menu-version">0.0.0</span></p>
  </section>

  <!-- Game -->
  <section id="view-game" class="view">
    <canvas id="field" width="400" height="400" aria-label="Field"></canvas>
    <div class="game-footer">
      <p class="hint">Tap the field to harvest.</p>
    </div>
  </section>

  <!-- Upgrade Shop -->
  <section id="view-upgrades" class="view">
    <h2>Upgrades</h2>
    <div id="upgrade-list" class="upgrade-list"></div>
    <div id="unlock-list" class="upgrade-list"></div>
    <button class="btn-primary" id="upgrades-continue" type="button">Continue</button>
  </section>

  <!-- Settings -->
  <section id="view-settings" class="view">
    <h2>Settings</h2>
    <div class="form-row">
      <label for="music-volume">Music Volume</label>
      <input type="range" id="music-volume" min="0" max="100" value="50" />
      <span class="value" id="music-volume-val">50</span>
    </div>
    <div class="form-row">
      <label for="fx-volume">FX Volume</label>
      <input type="range" id="fx-volume" min="0" max="100" value="50" />
      <span class="value" id="fx-volume-val">50</span>
    </div>
    <div class="form-row">
      <label for="mute">Mute</label>
      <input type="checkbox" id="mute" />
    </div>
    <div class="form-row">
      <span>Text Size</span>
      <div class="seg">
        <button data-text-size="10" type="button">10pt</button>
        <button data-text-size="12" type="button">12pt</button>
        <button data-text-size="14" type="button">14pt</button>
        <button data-text-size="16" type="button">16pt</button>
      </div>
    </div>

    <h3 class="section-head">Developer</h3>
    <div class="form-row">
      <label for="dev-mode">Dev Panel</label>
      <input type="checkbox" id="dev-mode" />
    </div>
    <div class="form-row dev-only hidden">
      <span>Add Gold</span>
      <div class="seg dev-btn-row">
        <button class="btn-dev" type="button" data-dev-gold="50">+50</button>
        <button class="btn-dev" type="button" data-dev-gold="100">+100</button>
        <button class="btn-dev" type="button" data-dev-gold="500">+500</button>
        <button class="btn-dev" type="button" data-dev-gold="1000">+1000</button>
      </div>
    </div>
    <div class="form-row dev-only hidden">
      <span>Tap Radius</span>
      <div class="seg dev-btn-row">
        <button class="btn-dev" id="dev-radius" type="button">+1 px</button>
        <span class="value" id="dev-radius-val">22</span>
      </div>
    </div>
    <div class="form-row dev-only hidden">
      <span>Resource Worth</span>
      <div class="seg dev-btn-row">
        <button class="btn-dev" id="dev-worth" type="button">+1 g</button>
        <span class="value" id="dev-worth-val">+0</span>
      </div>
    </div>

    <button class="btn-secondary" data-go="menu" type="button">Back</button>
  </section>

  <!-- Patch Notes -->
  <section id="view-patchnotes" class="view">
    <h2>Patch Notes</h2>
    <div id="patch-list" class="patch-list"></div>
    <button class="btn-secondary" data-go="menu" type="button">Back</button>
  </section>

  <!-- End-of-Run Modal -->
  <div id="end-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2>Out of Energy</h2>
      <p class="big-stat"><span id="end-gold">0</span> gold harvested</p>
      <ul class="end-breakdown" id="end-breakdown"></ul>
      <button class="btn-primary" id="end-continue" type="button">Continue</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden" role="status"></div>

</div>

<script src="js/patchnotes.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
